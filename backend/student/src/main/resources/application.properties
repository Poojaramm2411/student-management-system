spring.application.name=student
spring.datasource.url=jdbc:mysql://localhost:3306/student
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ✅ JWT secret — same key used in both JwtUtil and JwtAuthFilter
jwt.secret=MySuperSecretKeyForJwtTokenGeneration2024!

# ✅ Hide stack trace in Swagger error responses
server.error.include-stacktrace=never
server.error.include-message=always
# ✅ This is the key fix — disables Spring's default /error fallback for your exceptions  
spring.mvc.problemdetails.enabled=false
server.ssl.enabled=false
# ✅ Swagger - ADD THESE
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
